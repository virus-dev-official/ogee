# Publishes to npm when a GitHub release is published. npm trusts this workflow (trusted publishing),
# so no token is stored anywhere, and every version carries provenance: a signed record of the commit
# and the run that built it, shown on the package's npm page.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this run (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Release tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} doesn't match package.json version v${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm publish --access public
